<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#070a12" />
  <meta name="format-detection" content="telephone=no,email=no,address=no" />
  <title>机甲行动 · 主页面</title>
  <style>
    :root{
      --bg: #070a12;
      --panel: rgba(7, 12, 26, 0.72);
      --panel2: rgba(9, 16, 34, 0.58);
      --line: rgba(78, 116, 214, 0.25);
      --text: rgba(240, 248, 255, 0.92);
      --muted: rgba(205, 220, 255, 0.62);
      --cyan: #22d3ee;
      --magenta: #a78bfa;
      --amber: #fbbf24;
      --ok: #34d399;
      --shadow: 0 20px 80px rgba(0,0,0,0.55);
      --radius: 18px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body{
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "PingFang SC", "Noto Sans CJK SC", "Microsoft Yahei", Arial, sans-serif;
      overflow: hidden;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    /* Background */
    .stage{
      position: fixed;
      inset: 0;
      background:
        radial-gradient(1200px 700px at 70% 40%, rgba(34,211,238,0.10), transparent 60%),
        radial-gradient(900px 520px at 28% 70%, rgba(167,139,250,0.10), transparent 62%),
        url("mech-bg.svg") center/cover no-repeat;
      transform: translateZ(0);
    }
    .stage::before{
      content:"";
      position:absolute;
      inset:-20%;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.045) 0px, rgba(255,255,255,0.045) 1px, transparent 1px, transparent 6px),
        repeating-linear-gradient(90deg, rgba(34,211,238,0.05) 0px, rgba(34,211,238,0.05) 1px, transparent 1px, transparent 10px);
      opacity: 0.18;
      transform: rotate(-6deg);
      pointer-events:none;
    }
    .stage::after{
      content:"";
      position:absolute;
      inset:0;
      background:
        radial-gradient(900px 500px at 50% 50%, transparent 40%, rgba(0,0,0,0.55) 100%),
        linear-gradient(180deg, rgba(0,0,0,0.62), transparent 30%, transparent 70%, rgba(0,0,0,0.66));
      pointer-events:none;
    }

    /* Scan line */
    .scan{
      position: fixed;
      left: -20%;
      top: 0;
      width: 140%;
      height: 220px;
      background: linear-gradient(180deg, transparent, rgba(34,211,238,0.18), rgba(34,211,238,0.05), transparent);
      mix-blend-mode: screen;
      filter: blur(0.2px);
      opacity: 0.85;
      transform: translate3d(0,-40vh,0);
      animation: scan 4.2s linear infinite;
      pointer-events: none;
    }
    @keyframes scan{
      0% { transform: translate3d(0,-45vh,0) skewY(-2deg); }
      100% { transform: translate3d(0,120vh,0) skewY(-2deg); }
    }

    /* Layout */
    .ui{
      position: relative;
      height: 100%;
      padding:
        calc(18px + var(--safe-top))
        calc(18px + var(--safe-right))
        calc(18px + var(--safe-bottom))
        calc(18px + var(--safe-left));
      display: grid;
      grid-template-columns: minmax(280px, 420px) 1fr minmax(260px, 380px);
      grid-template-rows: 1fr;
      gap: 18px;
      align-items: stretch;
    }

    .panel{
      border-radius: var(--radius);
      background: linear-gradient(180deg, var(--panel), rgba(7,12,26,0.50));
      border: 1px solid rgba(120,160,255,0.18);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      overflow: hidden;
      position: relative;
    }
    .panel::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        linear-gradient(90deg, rgba(34,211,238,0.16), transparent 22%, transparent 78%, rgba(167,139,250,0.14)),
        repeating-linear-gradient(90deg, transparent 0px, transparent 18px, rgba(255,255,255,0.05) 18px, rgba(255,255,255,0.05) 19px);
      opacity: 0.18;
      pointer-events:none;
    }
    .panel .content{
      position: relative;
      padding: 18px 18px 16px;
    }

    /* Left: logo + menu */
    .brand{
      display:flex;
      flex-direction: column;
      height: 100%;
      gap: 14px;
    }
    .logo{
      border-radius: calc(var(--radius) - 6px);
      background: linear-gradient(135deg, rgba(34,211,238,0.16), rgba(167,139,250,0.10));
      border: 1px solid rgba(34,211,238,0.18);
      padding: 14px 14px 12px;
      position: relative;
      overflow: hidden;
    }
    .logo::after{
      content:"";
      position:absolute;
      inset:-40%;
      background: radial-gradient(circle at 30% 30%, rgba(34,211,238,0.20), transparent 45%),
                  radial-gradient(circle at 70% 60%, rgba(167,139,250,0.16), transparent 50%);
      transform: rotate(18deg);
      pointer-events:none;
    }
    .logo .title{
      position: relative;
      margin: 0;
      letter-spacing: 0.12em;
      font-weight: 800;
      font-size: clamp(22px, 2.2vw, 30px);
      text-transform: uppercase;
    }
    .logo .subtitle{
      position: relative;
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.08em;
      line-height: 1.4;
    }
    .logo .tag{
      position: relative;
      margin-top: 10px;
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      color: rgba(240,248,255,0.82);
      font-size: 12px;
    }
    .pill{
      display:inline-flex;
      align-items:center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(0,0,0,0.25);
      border: 1px solid rgba(255,255,255,0.10);
    }
    .dot{
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: var(--ok);
      box-shadow: 0 0 18px rgba(52,211,153,0.55);
    }

    .menu{
      display:flex;
      flex-direction: column;
      gap: 10px;
      margin-top: auto;
    }
    .btn{
      width: 100%;
      padding: 12px 14px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.12);
      background: linear-gradient(180deg, rgba(255,255,255,0.10), rgba(255,255,255,0.05));
      color: rgba(240,248,255,0.94);
      font-weight: 700;
      letter-spacing: 0.08em;
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }
    .btn:active{ transform: translateY(1px) scale(0.995); }
    .btn:hover{ border-color: rgba(34,211,238,0.28); }
    .btn.primary{
      border-color: rgba(34,211,238,0.35);
      background:
        linear-gradient(180deg, rgba(34,211,238,0.22), rgba(34,211,238,0.08)),
        radial-gradient(120px 120px at 20% 50%, rgba(34,211,238,0.22), transparent 60%);
      box-shadow: 0 0 0 1px rgba(34,211,238,0.10) inset;
    }
    .btn .k{
      display:flex;
      align-items:center;
      gap: 10px;
    }
    .btn .ic{
      width: 26px;
      height: 26px;
      border-radius: 10px;
      display:grid;
      place-items:center;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.10);
      font-size: 13px;
    }
    .btn .hint{
      color: rgba(205,220,255,0.70);
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.06em;
      white-space: nowrap;
    }
    .btn[disabled]{
      opacity: 0.56;
      cursor: not-allowed;
      filter: saturate(0.8);
    }

    /* Middle: world preview / top-down vibe */
    .preview{
      display:flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }
    .preview .content{
      height: 100%;
      display:flex;
      flex-direction: column;
      gap: 12px;
    }
    .map{
      border-radius: calc(var(--radius) - 8px);
      background:
        linear-gradient(180deg, rgba(0,0,0,0.28), rgba(0,0,0,0.12)),
        radial-gradient(700px 360px at 55% 45%, rgba(34,211,238,0.08), transparent 60%),
        radial-gradient(560px 300px at 35% 60%, rgba(167,139,250,0.08), transparent 62%);
      border: 1px solid rgba(120,160,255,0.16);
      position: relative;
      overflow: hidden;
      flex: 1;
      min-height: 220px;
    }
    .map::before{
      content:"";
      position:absolute;
      inset:0;
      background:
        repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0px, rgba(255,255,255,0.05) 1px, transparent 1px, transparent 18px),
        repeating-linear-gradient(90deg, rgba(255,255,255,0.04) 0px, rgba(255,255,255,0.04) 1px, transparent 1px, transparent 18px);
      opacity: 0.22;
      pointer-events:none;
    }
    .map::after{
      content:"";
      position:absolute;
      inset:-10%;
      background:
        conic-gradient(from 180deg at 55% 50%, transparent, rgba(34,211,238,0.10), transparent, rgba(167,139,250,0.08), transparent);
      opacity: 0.55;
      animation: drift 7.5s ease-in-out infinite alternate;
      pointer-events:none;
    }
    @keyframes drift{
      0%{ transform: translate3d(-1.2%, -0.8%, 0) rotate(-2deg); }
      100%{ transform: translate3d(1.5%, 1.0%, 0) rotate(2deg); }
    }
    .map .reticle{
      position:absolute;
      left: 52%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(44vh, 460px);
      height: min(44vh, 460px);
      border-radius: 50%;
      border: 1px solid rgba(34,211,238,0.24);
      box-shadow: 0 0 0 1px rgba(167,139,250,0.10) inset;
      opacity: 0.9;
    }
    .map .reticle::before,
    .map .reticle::after{
      content:"";
      position:absolute;
      inset: 18%;
      border-radius: 50%;
      border: 1px dashed rgba(205,220,255,0.18);
    }
    .map .reticle::after{
      inset: 36%;
      border-style: solid;
      border-color: rgba(167,139,250,0.16);
      opacity: 0.9;
    }
    .map .pip{
      position:absolute;
      width: 10px; height: 10px;
      border-radius: 999px;
      background: var(--amber);
      box-shadow: 0 0 18px rgba(251,191,36,0.35);
      left: 38%;
      top: 58%;
    }
    .map .pip2{
      position:absolute;
      width: 8px; height: 8px;
      border-radius: 999px;
      background: var(--cyan);
      box-shadow: 0 0 18px rgba(34,211,238,0.35);
      left: 66%;
      top: 40%;
      opacity: 0.85;
    }
    .map .label{
      position:absolute;
      left: 18px;
      bottom: 14px;
      display:flex;
      gap: 10px;
      align-items: center;
      color: rgba(205,220,255,0.70);
      font-size: 12px;
      letter-spacing: 0.08em;
    }
    .mono{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      letter-spacing: 0.06em;
    }

    /* Right: HUD cards */
    .hud{
      display:flex;
      flex-direction: column;
      gap: 12px;
      height: 100%;
    }
    .card{
      border-radius: calc(var(--radius) - 6px);
      background: linear-gradient(180deg, var(--panel2), rgba(0,0,0,0.16));
      border: 1px solid rgba(120,160,255,0.14);
      padding: 12px 12px 10px;
      position: relative;
      overflow:hidden;
    }
    .card h3{
      margin: 0 0 8px;
      font-size: 12px;
      letter-spacing: 0.16em;
      color: rgba(240,248,255,0.78);
      text-transform: uppercase;
    }
    .kv{
      display:grid;
      grid-template-columns: 1fr auto;
      gap: 8px 12px;
      align-items: center;
      font-size: 12px;
      color: rgba(205,220,255,0.75);
    }
    .kv b{
      color: rgba(240,248,255,0.92);
      font-weight: 700;
    }
    .bars{
      display:flex;
      gap: 6px;
      align-items: center;
      justify-content: flex-end;
    }
    .bar{
      width: 8px; height: 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.10);
      border: 1px solid rgba(255,255,255,0.10);
      overflow:hidden;
    }
    .bar > i{
      display:block;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(34,211,238,0.85), rgba(167,139,250,0.55));
      transform-origin: bottom;
      transform: scaleY(0.2);
      animation: beat 2.4s ease-in-out infinite;
    }
    .bar:nth-child(2) > i{ animation-delay: 120ms; transform: scaleY(0.35); }
    .bar:nth-child(3) > i{ animation-delay: 240ms; transform: scaleY(0.55); }
    .bar:nth-child(4) > i{ animation-delay: 360ms; transform: scaleY(0.75); }
    .bar:nth-child(5) > i{ animation-delay: 480ms; transform: scaleY(0.45); }
    @keyframes beat{
      0%,100%{ transform: scaleY(0.28); opacity: 0.75; }
      50%{ transform: scaleY(0.95); opacity: 1; }
    }

    .footerHint{
      margin-top: auto;
      color: rgba(205,220,255,0.62);
      font-size: 12px;
      letter-spacing: 0.06em;
      line-height: 1.35;
      padding-top: 8px;
    }

    /* Portrait overlay */
    .rotate{
      position: fixed;
      inset: 0;
      display:none;
      place-items: center;
      background: rgba(0,0,0,0.72);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 50;
      padding: 22px;
      text-align: center;
    }
    .rotate .box{
      max-width: 520px;
      width: 100%;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.14);
      background: rgba(7,12,26,0.70);
      box-shadow: var(--shadow);
      padding: 18px 16px;
    }
    .rotate .box h2{
      margin: 0 0 8px;
      font-size: 18px;
      letter-spacing: 0.10em;
    }
    .rotate .box p{
      margin: 0;
      color: rgba(205,220,255,0.72);
      font-size: 13px;
      line-height: 1.5;
    }

    /* Small landscape (phones) */
    @media (max-height: 440px){
      .ui{ gap: 12px; padding: calc(12px + var(--safe-top)) calc(12px + var(--safe-right)) calc(12px + var(--safe-bottom)) calc(12px + var(--safe-left)); }
      .panel .content{ padding: 14px 14px 12px; }
      .btn{ padding: 11px 12px; }
    }
    @media (max-width: 920px){
      .ui{
        grid-template-columns: minmax(260px, 360px) 1fr;
        grid-template-rows: 1fr;
      }
      .ui > .right { display: none; }
    }

    @media (prefers-reduced-motion: reduce){
      .scan{ display:none; }
      .map::after{ animation: none; }
      .bar > i{ animation: none; transform: scaleY(0.6); }
    }

    /* show rotate overlay in portrait */
    @media (orientation: portrait){
      .rotate{ display:grid; }
    }
  </style>
</head>
<body>
  <div class="stage" aria-hidden="true"></div>
  <div class="scan" aria-hidden="true"></div>

  <main class="ui" role="main" aria-label="主页面">
    <!-- Left -->
    <section class="panel">
      <div class="content brand">
        <div class="logo">
          <h1 class="title">MECH OPS</h1>
          <p class="subtitle">横屏俯视手游 · 主页面（仅 UI 骨架）<br/>背景：机甲机库/甲板风格。</p>
          <div class="tag">
            <span class="pill"><span class="dot"></span> 系统在线</span>
            <span class="pill mono">v0.1.0</span>
            <span class="pill mono" id="clock">--:--</span>
          </div>
        </div>

        <div class="menu" aria-label="主菜单">
          <button class="btn primary" id="btnStart" type="button">
            <span class="k"><span class="ic">▶</span>开始作战</span>
            <span class="hint">进入（占位）</span>
          </button>
          <button class="btn" type="button" disabled>
            <span class="k"><span class="ic">▦</span>机库</span>
            <span class="hint">敬请期待</span>
          </button>
          <button class="btn" type="button" disabled>
            <span class="k"><span class="ic">⚙</span>设置</span>
            <span class="hint">敬请期待</span>
          </button>
        </div>
      </div>
    </section>

    <!-- Middle -->
    <section class="panel">
      <div class="content preview">
        <div class="map" aria-label="俯视预览">
          <div class="reticle" aria-hidden="true"></div>
          <div class="pip" aria-hidden="true"></div>
          <div class="pip2" aria-hidden="true"></div>
          <div class="label">
            <span class="mono">OPS GRID</span>
            <span>·</span>
            <span class="mono">SECTOR 07</span>
            <span>·</span>
            <span class="mono">READY</span>
          </div>
        </div>

        <div class="footerHint">
          提示：当前只做主页面。按钮点击只会弹出占位提示，后续再接入“开始/角色/商店/设置”等功能。
        </div>
      </div>
    </section>

    <!-- Right -->
    <section class="panel right">
      <div class="content hud">
        <div class="card">
          <h3>COMMS</h3>
          <div class="kv">
            <span>频道</span><b class="mono">ALPHA</b>
            <span>信号</span>
            <span class="bars" aria-label="信号强度">
              <span class="bar"><i></i></span>
              <span class="bar"><i></i></span>
              <span class="bar"><i></i></span>
              <span class="bar"><i></i></span>
              <span class="bar"><i></i></span>
            </span>
          </div>
        </div>

        <div class="card">
          <h3>LOADOUT</h3>
          <div class="kv">
            <span>机体</span><b>“夜枭” Mk‑I</b>
            <span>能量</span><b class="mono" id="energy">78%</b>
            <span>装甲</span><b class="mono">A‑3</b>
          </div>
        </div>

        <div class="card">
          <h3>MISSION</h3>
          <div class="kv">
            <span>目标</span><b>进入战区（占位）</b>
            <span>状态</span><b style="color: rgba(34,211,238,0.95)">待命</b>
          </div>
        </div>

        <div class="card">
          <h3>SYSTEM</h3>
          <div class="kv">
            <span>渲染</span><b class="mono">60fps</b>
            <span>输入</span><b>触控 / 手柄</b>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="rotate" role="dialog" aria-live="polite" aria-label="请横屏">
    <div class="box">
      <h2>请将手机横过来</h2>
      <p>这是一个横屏俯视手游主页面示例。把设备旋转到横屏后，会显示机甲风主界面。</p>
    </div>
  </div>

  <script>
    const clockEl = document.getElementById("clock");
    const energyEl = document.getElementById("energy");
    const btnStart = document.getElementById("btnStart");

    function pad2(n){ return String(n).padStart(2, "0"); }
    function tick(){
      const d = new Date();
      clockEl.textContent = `${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }
    tick();
    setInterval(tick, 1000 * 10);

    // Small ambient energy drift (purely cosmetic)
    let e = 78;
    setInterval(() => {
      const delta = (Math.random() - 0.5) * 3;
      e = Math.max(55, Math.min(96, e + delta));
      energyEl.textContent = `${Math.round(e)}%`;
    }, 1200);

    btnStart.addEventListener("click", () => {
      alert("开始作战：占位提示（后续再接入真实游戏流程）");
    });
  </script>
</body>
</html>
