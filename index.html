<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>欢迎回来</title>
    <style>
      :root {
        --bg1: #fff3e5;
        --bg2: #ffe6f2;
        --bg3: #eaf4ff;
        --ink: #1f2430;
        --muted: rgba(31, 36, 48, 0.72);
        --card: rgba(255, 255, 255, 0.62);
        --card-border: rgba(255, 255, 255, 0.55);
        --shadow: 0 24px 80px rgba(31, 36, 48, 0.16);
      }

      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial,
          "Apple Color Emoji", "Segoe UI Emoji";
        color: var(--ink);
        overflow: hidden;
        background: radial-gradient(1200px 900px at 50% 38%, var(--bg1) 0%, var(--bg2) 55%, var(--bg3) 100%);
      }

      .bg {
        position: absolute;
        inset: -2%;
        background:
          radial-gradient(1000px 700px at 20% 20%, rgba(255, 255, 255, 0.55), transparent 55%),
          radial-gradient(900px 650px at 80% 15%, rgba(255, 255, 255, 0.45), transparent 55%),
          radial-gradient(900px 800px at 60% 85%, rgba(255, 255, 255, 0.55), transparent 60%);
        filter: blur(0px);
        animation: bgFloat 10s ease-in-out infinite;
        opacity: 0.9;
      }
      @keyframes bgFloat {
        0%, 100% { transform: translate3d(0, 0, 0) scale(1); }
        50% { transform: translate3d(0, -10px, 0) scale(1.02); }
      }

      .wrap {
        position: relative;
        height: 100%;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(980px, 92vw);
        height: min(560px, 84vh);
        border-radius: 28px;
        background: var(--card);
        border: 1px solid var(--card-border);
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        position: relative;
        overflow: hidden;
      }

      .shine {
        position: absolute;
        inset: -40%;
        background: linear-gradient(120deg, transparent 40%, rgba(255, 255, 255, 0.55) 50%, transparent 60%);
        transform: translateX(-35%) rotate(6deg);
        animation: shine 4.8s ease-in-out infinite;
        pointer-events: none;
        opacity: 0.7;
      }
      @keyframes shine {
        0%, 100% { transform: translateX(-35%) rotate(6deg); opacity: 0.4; }
        50% { transform: translateX(35%) rotate(6deg); opacity: 0.9; }
      }

      .content {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 1.05fr 0.95fr;
        gap: 20px;
        padding: clamp(20px, 4.2vw, 44px);
        align-items: center;
      }

      .left {
        align-self: center;
      }

      .kicker {
        display: inline-flex;
        gap: 10px;
        align-items: center;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.65);
        border: 1px solid rgba(255, 255, 255, 0.6);
        box-shadow: 0 10px 40px rgba(31, 36, 48, 0.08);
        color: var(--muted);
        font-weight: 600;
        letter-spacing: 0.2px;
        transform: translateY(6px);
        opacity: 0;
        animation: enterUp 900ms cubic-bezier(.2,.8,.2,1) 120ms forwards;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #6edb8c;
        box-shadow: 0 0 0 6px rgba(110, 219, 140, 0.18);
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 0 6px rgba(110, 219, 140, 0.18); }
        50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(110, 219, 140, 0.12); }
      }

      h1 {
        margin: 18px 0 10px;
        font-size: clamp(40px, 5.2vw, 64px);
        line-height: 1.08;
        letter-spacing: -0.02em;
      }

      .type {
        display: inline-block;
        position: relative;
        padding-right: 10px;
      }
      .type::after {
        content: "";
        position: absolute;
        right: 0;
        top: 0.08em;
        width: 3px;
        height: 0.95em;
        background: rgba(31, 36, 48, 0.7);
        border-radius: 2px;
        animation: caret 900ms steps(1, end) infinite;
      }
      @keyframes caret {
        0%, 45% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .sub {
        margin: 0 0 20px;
        font-size: clamp(14px, 1.9vw, 18px);
        color: var(--muted);
        line-height: 1.6;
        max-width: 44ch;
        transform: translateY(8px);
        opacity: 0;
        animation: enterUp 900ms cubic-bezier(.2,.8,.2,1) 360ms forwards;
      }

      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        transform: translateY(10px);
        opacity: 0;
        animation: enterUp 900ms cubic-bezier(.2,.8,.2,1) 520ms forwards;
      }

      button {
        appearance: none;
        border: none;
        cursor: pointer;
        border-radius: 14px;
        padding: 12px 16px;
        font-weight: 700;
        letter-spacing: 0.2px;
        transition: transform 140ms ease, box-shadow 140ms ease, background 140ms ease;
      }
      .primary {
        background: linear-gradient(135deg, #6edb8c, #4fb7ff);
        color: #0d1720;
        box-shadow: 0 16px 50px rgba(79, 183, 255, 0.28);
      }
      .primary:hover { transform: translateY(-1px); box-shadow: 0 18px 58px rgba(79, 183, 255, 0.32); }
      .ghost {
        background: rgba(255, 255, 255, 0.7);
        color: rgba(31, 36, 48, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.65);
        box-shadow: 0 14px 40px rgba(31, 36, 48, 0.10);
      }
      .ghost:hover { transform: translateY(-1px); }

      .right {
        display: grid;
        place-items: center;
        position: relative;
      }

      .pet {
        width: min(340px, 44vw);
        aspect-ratio: 1 / 1;
        border-radius: 28px;
        background: rgba(255, 255, 255, 0.35);
        border: 1px solid rgba(255, 255, 255, 0.55);
        box-shadow: 0 24px 70px rgba(31, 36, 48, 0.14);
        display: grid;
        place-items: center;
        position: relative;
        overflow: hidden;
        transform: translateY(14px) scale(0.98);
        opacity: 0;
        animation: enterPet 1000ms cubic-bezier(.2,.8,.2,1) 220ms forwards;
      }
      @keyframes enterPet {
        to { transform: translateY(0) scale(1); opacity: 1; }
      }

      .pet::before {
        content: "";
        position: absolute;
        inset: -40%;
        background: radial-gradient(circle at 40% 30%, rgba(255, 255, 255, 0.65), transparent 45%);
        animation: petGlow 4.6s ease-in-out infinite;
        opacity: 0.75;
      }
      @keyframes petGlow {
        0%, 100% { transform: translate3d(0, 0, 0) rotate(0deg); }
        50% { transform: translate3d(18px, -10px, 0) rotate(6deg); }
      }

      .pet img {
        width: 110%;
        height: 110%;
        object-fit: cover;
        transform: translateY(6px);
        animation: float 3.4s ease-in-out infinite;
        filter: saturate(1.02) contrast(1.01);
      }
      @keyframes float {
        0%, 100% { transform: translateY(6px); }
        50% { transform: translateY(-10px); }
      }

      .bubbles {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .bubble {
        position: absolute;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.75);
        opacity: 0;
        animation: bubbleUp 5.4s ease-in-out infinite;
      }
      @keyframes bubbleUp {
        0% { transform: translateY(24px) scale(0.9); opacity: 0; }
        12% { opacity: 0.65; }
        55% { opacity: 0.55; }
        100% { transform: translateY(-86px) scale(1.15); opacity: 0; }
      }

      @keyframes enterUp {
        to { transform: translateY(0); opacity: 1; }
      }

      /* Responsive */
      @media (max-width: 840px) {
        .content {
          grid-template-columns: 1fr;
          text-align: center;
        }
        .sub { margin-left: auto; margin-right: auto; }
        .actions { justify-content: center; }
        .pet { width: min(340px, 76vw); }
      }

      /* Reduced motion */
      @media (prefers-reduced-motion: reduce) {
        .bg, .shine, .dot, .pet::before, .pet img, .bubble, .type::after {
          animation: none !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="bg" aria-hidden="true"></div>
    <div class="wrap">
      <main class="card" role="main" aria-label="欢迎回来">
        <div class="shine" aria-hidden="true"></div>
        <div class="content">
          <section class="left">
            <div class="kicker">
              <span class="dot" aria-hidden="true"></span>
              <span>状态：已准备好迎接你</span>
            </div>
            <h1><span id="type" class="type"></span></h1>
            <p class="sub">今天也辛苦啦。先歇一会儿吧，我会把你喜欢的东西都准备好。</p>
            <div class="actions">
              <button class="primary" id="btnContinue" type="button">继续</button>
              <button class="ghost" id="btnChangeName" type="button">换个称呼</button>
            </div>
          </section>
          <section class="right" aria-hidden="true">
            <div class="pet">
              <img src="./animal-cute.svg" alt="可爱小动物" />
              <div class="bubbles" id="bubbles"></div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <script>
      // Simple typewriter (no external deps)
      const el = document.getElementById("type");
      const defaultName = "朋友";
      let name = defaultName;

      function message() {
        return `欢迎回来，${name}。`;
      }

      async function typeText(text) {
        el.textContent = "";
        for (let i = 0; i < text.length; i++) {
          el.textContent += text[i];
          await new Promise((r) => setTimeout(r, 60));
        }
      }

      // Bubbles
      const bubbles = document.getElementById("bubbles");
      const bubbleSeeds = [
        { left: 18, top: 78, delay: 0.2, dur: 5.6, size: 10 },
        { left: 80, top: 74, delay: 1.1, dur: 5.2, size: 8 },
        { left: 64, top: 88, delay: 2.0, dur: 5.8, size: 12 },
        { left: 30, top: 92, delay: 1.7, dur: 5.4, size: 9 },
        { left: 52, top: 80, delay: 2.6, dur: 6.0, size: 11 },
      ];
      for (const b of bubbleSeeds) {
        const div = document.createElement("div");
        div.className = "bubble";
        div.style.left = b.left + "%";
        div.style.top = b.top + "%";
        div.style.width = b.size + "px";
        div.style.height = b.size + "px";
        div.style.animationDelay = b.delay + "s";
        div.style.animationDuration = b.dur + "s";
        bubbles.appendChild(div);
      }

      // Buttons
      document.getElementById("btnChangeName").addEventListener("click", async () => {
        const next = prompt("想让我怎么称呼你？", name);
        name = (next || "").trim() || defaultName;
        await typeText(message());
      });
      document.getElementById("btnContinue").addEventListener("click", async () => {
        await typeText("走吧，我们开始今天的小冒险。");
      });

      typeText(message());
    </script>
  </body>
</html>
